name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        # Reduces cache key length to avoid GitHub's 512-char limit (HTTP 400 errors)
        # Limited cache includes help generate shorter keys
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        gradle-home-cache-includes: |
          caches
          notifications

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore

    - name: Build, test, and generate coverage
      env:
        SIGNING_STORE_FILE: release.keystore
        SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew build jacocoDebugUnitTestReport

    - name: Publish coverage summary
      if: always()
      run: |
        python3 - <<'PY' > "$RUNNER_TEMP/coverage-summary.md"
        from pathlib import Path
        import xml.etree.ElementTree as ET

        report = Path("app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml")

        print("## Coverage")
        print()

        if not report.exists():
            print("JaCoCo coverage report was not generated.")
            raise SystemExit(0)

        root = ET.parse(report).getroot()
        metrics = [
            ("Instructions", "INSTRUCTION"),
            ("Branches", "BRANCH"),
            ("Lines", "LINE"),
            ("Methods", "METHOD"),
            ("Classes", "CLASS"),
        ]

        print("| Metric | Covered | Missed | Coverage |")
        print("| --- | ---: | ---: | ---: |")

        for label, counter_type in metrics:
            counter = root.find(f"./counter[@type='{counter_type}']")
            if counter is None:
                continue

            covered = int(counter.attrib["covered"])
            missed = int(counter.attrib["missed"])
            total = covered + missed
            coverage = covered / total * 100 if total else 0
            print(f"| {label} | {covered} | {missed} | {coverage:.2f}% |")
        PY
        cat "$RUNNER_TEMP/coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment coverage on PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- logiscanner-coverage-report -->';
          const summaryPath = `${process.env.RUNNER_TEMP}/coverage-summary.md`;
          const summary = fs.existsSync(summaryPath)
            ? fs.readFileSync(summaryPath, 'utf8').trim()
            : '## Coverage\n\nJaCoCo coverage summary was not generated.';
          const body = `${marker}\n${summary}`;
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((comment) =>
            comment.user?.type === 'Bot' && comment.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-debug-unit-test-report
        path: |
          app/build/reports/jacoco/jacocoDebugUnitTestReport
          app/build/reports/tests/testDebugUnitTest
        if-no-files-found: warn
